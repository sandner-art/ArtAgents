name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -r requirements-pillow.txt
          python -m pip install pytest pip-audit
      - name: Run tests
        run: python -m pytest -q
      - name: Audit installed packages for known vulnerabilities
        # Audits the environment as installed (with the Pillow override applied).
        run: pip-audit --progress-spinner off
