  #   folder: "C:/models/my-tagger"
  #   model_file: model.onnx
  #   labels_file: tags.csv
  #   layout: NCHW
  #   channels: RGB
  #   normalize: imagenet
  #   pad: [127, 127, 127]
  #   license: "check the model card"
